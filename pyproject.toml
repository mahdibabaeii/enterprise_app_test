[project]
name = "card-decision-service"
version = "0.1.0"
description = "Tamper-evident card transaction decision service (vertical slice)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "control(control_id): the control id from docs/plan.md section 4 that this test covers",
]
